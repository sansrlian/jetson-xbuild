
# --- jetson-orin-xbuild ---
if [ -f /opt/ros/${ROS_DISTRO:-kilted}/setup.bash ]; then
  # shellcheck disable=SC1090
  . /opt/ros/${ROS_DISTRO:-kilted}/setup.bash
fi
export ARM64_SYSROOT="${ARM64_SYSROOT:-/opt/arm64_sysroot}"
export ROS2_WS="${ROS2_WS:-/home/ubuntu/ros2_ws}"
export TOOLCHAINS_WS="${TOOLCHAINS_WS:-/home/ubuntu/toolchains}"
export PRODUCT="${PRODUCT:-ORIN_AGX}"
export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

# Tab-completion for cross-colcon-build
_cross_colcon_build_complete() {
  local cur
  COMPREPLY=()
  cur="${COMP_WORDS[COMP_CWORD]}"
  # Delegate lightly to filename completion; colcon completion may also be loaded
  COMPREPLY=( $(compgen -f -- "$cur") )
}
complete -o default -o nospace -F _cross_colcon_build_complete cross-colcon-build
